<div class="min-h-dvh sm:py-6 sm:px-3">
  <div
    class="w-full max-w-[520px] mx-auto bg-panel min-h-dvh sm:min-h-[calc(100dvh-48px)] sm:rounded-[20px] sm:border sm:border-line sm:shadow-lg flex flex-col relative overflow-hidden"
  >
    <header class="flex-none flex justify-between items-center border-b border-line pl-[18px] pr-[18px] pt-1.5 pb-3.5">
      <div>
        <p class="m-0 text-[11.5px] text-muted">Hola,</p>
        <h1 class="mt-0.5 text-[18px] font-display font-bold tracking-[-0.01em]">{{ usuario()?.nombre }} 👋</h1>
      </div>
      <div class="flex items-center gap-[5px] bg-success-tint text-success px-2.5 py-[5px] rounded-full text-[10.5px] font-bold font-mono">
        <i class="w-1.5 h-1.5 rounded-full bg-success inline-block"></i>
        Sincronizado
      </div>
    </header>

    <div class="flex-1 overflow-y-auto bg-app-bg relative">
      <router-outlet />
    </div>

    <nav class="flex-none flex justify-around items-center px-1.5 py-[9px] bg-panel border-t border-line">
      <a
        routerLink="/app/ruta"
        routerLinkActive="text-brand"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex-1 flex flex-col items-center gap-[3px] text-muted text-[9.5px] font-semibold px-2 py-1 rounded-[10px]"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[21px] h-[21px]">
          <path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        Ruta
      </a>
      <a
        routerLink="/app/banco-imagenes"
        routerLinkActive="text-brand"
        class="flex-1 flex flex-col items-center gap-[3px] text-muted text-[9.5px] font-semibold px-2 py-1 rounded-[10px]"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[21px] h-[21px]">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
        Imágenes
      </a>
      <a
        routerLink="/app/perfil"
        routerLinkActive="text-brand"
        class="flex-1 flex flex-col items-center gap-[3px] text-muted text-[9.5px] font-semibold px-2 py-1 rounded-[10px]"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[21px] h-[21px]">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Perfil
      </a>
    </nav>
  </div>
</div>
