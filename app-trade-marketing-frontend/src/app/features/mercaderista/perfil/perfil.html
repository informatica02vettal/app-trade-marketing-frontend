<div class="p-4">
  <div class="text-center mb-6">
    <div
      class="w-14 h-14 rounded-full bg-brand-tint text-brand-dim flex items-center justify-center mx-auto mb-2 font-display font-bold text-lg"
    >
      {{ usuario()?.nombre?.charAt(0) }}
    </div>
    <p class="font-display font-bold text-[15px]">{{ usuario()?.nombre }}</p>
    <p class="text-muted text-[12px]">{{ usuario()?.region }} · {{ usuario()?.ejecutivoAsociado }}</p>
  </div>

  <div class="border border-line rounded-xl overflow-hidden mb-6">
    <div class="flex justify-between px-3 py-2.5 border-b border-line">
      <p class="text-[13px]">Visitas completadas</p>
      <span class="font-mono font-bold">{{ visitasCompletadas() }}</span>
    </div>
    <div class="flex justify-between px-3 py-2.5 border-b border-line">
      <p class="text-[13px]">Fotos capturadas</p>
      <span class="font-mono font-bold">{{ fotosCapturadas() }}</span>
    </div>
    <div class="flex justify-between px-3 py-2.5">
      <p class="text-[13px]">Hallazgos de mercado reportados</p>
      <span class="font-mono font-bold">{{ hallazgosReportados() }}</span>
    </div>
  </div>

  <button
    type="button"
    (click)="cerrarSesion()"
    class="w-full rounded-[11px] border border-danger text-danger font-bold text-[13.5px] py-3"
  >
    Cerrar sesión
  </button>
</div>
