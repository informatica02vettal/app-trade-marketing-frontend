<div class="min-h-dvh flex items-center justify-center bg-app-bg px-4 py-8">
  <div class="w-full max-w-[380px] bg-panel border border-line rounded-2xl p-8 shadow-sm">
    <h2 class="font-display text-xl font-bold text-center mb-1">Vettal Trade Marketing</h2>
    <p class="text-muted text-[12.5px] text-center mb-6">Ingresa con tu correo y contraseña</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-3">
      <div>
        <label class="block text-[11px] font-mono uppercase tracking-wide text-muted mb-1">Correo</label>
        <input
          type="email"
          formControlName="email"
          placeholder="nombre@vettal.com.ve"
          class="w-full rounded-[11px] border border-line px-3 py-2.5 text-[13.5px] outline-none focus:border-brand"
        />
      </div>
      <div>
        <label class="block text-[11px] font-mono uppercase tracking-wide text-muted mb-1">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full rounded-[11px] border border-line px-3 py-2.5 text-[13.5px] outline-none focus:border-brand"
        />
      </div>

      @if (error()) {
        <p class="text-danger text-[12.5px] bg-danger-tint rounded-lg px-3 py-2">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="cargando()"
        class="mt-2 rounded-[11px] bg-brand text-white font-bold text-[13.5px] py-3 disabled:opacity-60"
      >
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
