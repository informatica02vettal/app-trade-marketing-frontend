<div class="p-6">
  <h1 class="font-display text-xl font-bold mb-4">Inteligencia de mercado</h1>

  <div class="flex gap-2 mb-4">
    <select [ngModel]="filtroTipo()" (ngModelChange)="filtroTipo.set($event); cargar()" class="rounded-lg border border-line px-3 py-2 text-[13px]">
      <option value="">Todos los tipos</option>
      @for (t of tipos; track t) {
        <option [value]="t">{{ t }}</option>
      }
    </select>
    <select [ngModel]="filtroMarcaId()" (ngModelChange)="filtroMarcaId.set($event); cargar()" class="rounded-lg border border-line px-3 py-2 text-[13px]">
      <option [ngValue]="null">Todas las marcas</option>
      @for (m of marcas(); track m.id) {
        <option [ngValue]="m.id">{{ m.nombre }}</option>
      }
    </select>
  </div>

  <div class="bg-panel border border-line rounded-2xl overflow-hidden">
    <table class="w-full text-[13px]">
      <thead class="bg-panel-alt text-muted text-[11px] uppercase">
        <tr>
          <th class="text-left px-3 py-2">Tipo</th>
          <th class="text-left px-3 py-2">Marca</th>
          <th class="text-left px-3 py-2">Mercaderista</th>
          <th class="text-left px-3 py-2">Detalle</th>
        </tr>
      </thead>
      <tbody>
        @for (h of hallazgos(); track h.id) {
          <tr class="border-t border-line">
            <td class="px-3 py-2">{{ h.tipo }}</td>
            <td class="px-3 py-2">{{ h.marcaNombre || '—' }}</td>
            <td class="px-3 py-2">{{ h.usuarioNombre }}</td>
            <td class="px-3 py-2">{{ h.observacionTexto || h.detalle || (h.productos.length + ' producto(s)') }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
